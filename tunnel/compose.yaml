name: tunnel

services:
  # Cloudflare Tunnel
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    networks:
      - core
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
      - TUNNEL_METRICS=127.0.0.1:2000
    healthcheck:
      test: ["CMD", "cloudflared", "tunnel", "ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    labels:
      - homepage.group=Core
      - homepage.name=Cloudflare Tunnel
      - homepage.description=Remote access tunnel
      - homepage.icon=cloudflare
      - homepage.href=https://one.dash.cloudflare.com/${CLOUDFLARE_ACCOUNT_ID}/networks/connectors
      - homepage.widget.type=cloudflared
      - homepage.widget.accountid=${CLOUDFLARE_ACCOUNT_ID}
      - homepage.widget.tunnelid=${CLOUDFLARE_TUNNEL_ID}
      - homepage.widget.key=${CLOUDFLARE_API_KEY}

networks:
  core:
    external: true
