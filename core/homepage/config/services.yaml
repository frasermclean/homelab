# Services: https://gethomepage.dev/configs/services/
# {{HOMEPAGE_VAR_*}} placeholders are filled from the container environment

- Core:
    - Roach ADM:
        description: NAS administration interface
        href: https://roach.{{HOMEPAGE_VAR_DOMAIN}}
        icon: asustor

    - Proxmox VE:
        description: Virtualisation cluster
        href: https://pve.{{HOMEPAGE_VAR_DOMAIN}}
        icon: proxmox
        widget:
          type: proxmox
          url: https://pve.{{HOMEPAGE_VAR_DOMAIN}}
          username: "{{HOMEPAGE_VAR_PVE_TOKEN_ID}}"
          password: "{{HOMEPAGE_VAR_PVE_TOKEN_SECRET}}"

    - Proxmox Backup Server:
        description: VM and container backups
        href: https://pbs.{{HOMEPAGE_VAR_DOMAIN}}
        icon: proxmox
        widget:
          type: proxmoxbackupserver
          url: https://pbs.{{HOMEPAGE_VAR_DOMAIN}}
          username: "{{HOMEPAGE_VAR_PBS_TOKEN_ID}}"
          password: "{{HOMEPAGE_VAR_PBS_TOKEN_SECRET}}"

- Media:
    - Plex:
        description: Media server
        href: https://plex.{{HOMEPAGE_VAR_DOMAIN}}
        icon: plex
        widget:
          type: plex
          url: https://plex.{{HOMEPAGE_VAR_DOMAIN}}
          key: "{{HOMEPAGE_VAR_PLEX_TOKEN}}"
