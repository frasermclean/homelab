# yaml-language-server: $schema=https://www.schemastore.org/traefik-v3-file-provider.json
# Dynamic config - Traefik fills {{ env "..." }} templates from the container environment

http:
  services:
    roach-adm:
      loadBalancer:
        serversTransport: insecureTransport
        servers:
          - url: http://roach.{{ env "DOMAIN" }}:8080

    pve:
      loadBalancer:
        servers:
          - url: https://lurker.{{ env "DOMAIN" }}:8006
          - url: https://infestor.{{ env "DOMAIN" }}:8006
        sticky:
          cookie:
            name: pve_sticky
            secure: true
            httpOnly: true
        healthCheck:
          path: /
          interval: 10s
          timeout: 3s

    plex:
      loadBalancer:
        serversTransport: insecureTransport
        servers:
          - url: http://192.168.1.7:32400

    pbs:
      loadBalancer:
        serversTransport: insecureTransport
        servers:
          - url: https://192.168.4.5:8007

  routers:
    roach-adm:
      rule: 'Host(`roach.{{ env "DOMAIN" }}`)'
      service: roach-adm

    pve:
      rule: 'Host(`pve.{{ env "DOMAIN" }}`)'
      service: pve
      middlewares:
        - local-ip-whitelist

    pbs:
      rule: 'Host(`pbs.{{ env "DOMAIN" }}`)'
      service: pbs
      middlewares:
        - local-ip-whitelist

    plex:
      rule: 'Host(`plex.{{ env "DOMAIN" }}`)'
      service: plex

  # allow self-signed certificates for proxied web services
  serversTransports:
    insecureTransport:
      insecureSkipVerify: true

  middlewares:
    local-ip-whitelist:
      ipAllowList:
        sourceRange:
          - 127.0.0.1/32 # localhost
          - 10.0.0.0/8 # private class A
          - 172.16.0.0/12 # private class B
          - 192.168.0.0/16 # private class C
        #ipStrategy: # https://doc.traefik.io/traefik/v3.5/middlewares/http/ipallowlist/#ipstrategydepth
        #depth: 1 # get the ip from the X-Forwarded-For header

    basic-auth:
      basicAuth: # use bcrypt - https://hostingcanada.org/htpasswd-generator/
        users:
          - '{{ env "BASIC_AUTH_USER" }}' # user:bcrypt-hash

tls:
  options:
    default:
      sniStrict: true
