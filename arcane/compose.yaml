services:
  # Docker socket proxy for Arcane only - Traefik and Homepage use the read-only one in core
  arcane-socket-proxy:
    image: wollomatic/socket-proxy:1.13.1
    container_name: arcane-socket-proxy
    user: '0:0'
    command:
      - '-listenip=0.0.0.0'
      - '-allowfrom=arcane-manager,arcane-upgrader'
      - '-allowhealthcheck'
      - '-allowGET=(/v[\d.]+)?/_ping'
      - '-allowGET=(/v[\d.]+)?/events(/.*)?'
      - '-allowGET=(/v[\d.]+)?/version'
      - '-allowGET=(/v[\d.]+)?/info(/.*)?'
      - '-allowGET=(/v[\d.]+)?/system/df'
      - '-allowGET=(/v[\d.]+)?/containers(/.*)?'
      - '-allowGET=(/v[\d.]+)?/exec(/.*)?'
      - '-allowGET=(/v[\d.]+)?/images(/.*)?'
      - '-allowGET=(/v[\d.]+)?/networks(/.*)?'
      - '-allowGET=(/v[\d.]+)?/volumes(/.*)?'
      - '-allowGET=(/v[\d.]+)?/distribution(/.*)?'
      - '-allowGET=(/v[\d.]+)?/swarm(/.*)?'
      - '-allowGET=(/v[\d.]+)?/nodes(/.*)?'
      - '-allowGET=(/v[\d.]+)?/services(/.*)?'
      - '-allowGET=(/v[\d.]+)?/tasks(/.*)?'
      - '-allowGET=(/v[\d.]+)?/secrets(/.*)?'
      - '-allowGET=(/v[\d.]+)?/configs(/.*)?'
      - '-allowHEAD=(/v[\d.]+)?/_ping'
      - '-allowHEAD=(/v[\d.]+)?/version'
      - '-allowPOST=(/v[\d.]+)?/containers(/.*)?'
      - '-allowPOST=(/v[\d.]+)?/exec(/.*)?'
      - '-allowPOST=(/v[\d.]+)?/images(/.*)?'
      - '-allowPOST=(/v[\d.]+)?/networks(/.*)?'
      - '-allowPOST=(/v[\d.]+)?/volumes(/.*)?'
      - '-allowPOST=(/v[\d.]+)?/commit'
      - '-allowPOST=(/v[\d.]+)?/build(/.*)?'
      - '-allowPOST=(/v[\d.]+)?/session'
      - '-allowPOST=(/v[\d.]+)?/grpc'
      - '-allowPOST=(/v[\d.]+)?/auth'
      - '-allowPOST=(/v[\d.]+)?/swarm(/.*)?'
      - '-allowPOST=(/v[\d.]+)?/nodes(/.*)?'
      - '-allowPOST=(/v[\d.]+)?/services(/.*)?'
      - '-allowPOST=(/v[\d.]+)?/secrets(/.*)?'
      - '-allowPOST=(/v[\d.]+)?/configs(/.*)?'
      - '-allowPUT=(/v[\d.]+)?/containers(/.*)?'
      - '-allowDELETE=(/v[\d.]+)?/containers(/.*)?'
      - '-allowDELETE=(/v[\d.]+)?/images(/.*)?'
      - '-allowDELETE=(/v[\d.]+)?/networks(/.*)?'
      - '-allowDELETE=(/v[\d.]+)?/volumes(/.*)?'
      - '-allowDELETE=(/v[\d.]+)?/nodes(/.*)?'
      - '-allowDELETE=(/v[\d.]+)?/services(/.*)?'
      - '-allowDELETE=(/v[\d.]+)?/secrets(/.*)?'
      - '-allowDELETE=(/v[\d.]+)?/configs(/.*)?'
    networks:
      - core
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ['CMD', './healthcheck']
      interval: 2s
      timeout: 5s
      retries: 15
    restart: unless-stopped

  manager:
    image: ghcr.io/getarcaneapp/manager:latest
    container_name: arcane-manager
    ports:
      - '3552:3552'
    volumes:
      - ${DATA_DIRECTORY:?DATA_DIRECTORY must be set}:/app/data
      - ${PROJECTS_DIRECTORY:?PROJECTS_DIRECTORY must be set}:${PROJECTS_DIRECTORY:?PROJECTS_DIRECTORY must be set}:z
    environment:
      - PUID=${PUID:?PUID must be set}
      - PGID=${PGID:?PGID must be set}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:?ENCRYPTION_KEY must be set}
      - PROJECTS_DIRECTORY=${PROJECTS_DIRECTORY:?PROJECTS_DIRECTORY must be set}
      - DOCKER_HOST=tcp://arcane-socket-proxy:2375
    networks:
      - core
    depends_on:
      arcane-socket-proxy:
        condition: service_healthy
    healthcheck:
      test: ['CMD', './arcane', 'health', '--timeout', '2s']
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.http.routers.arcane.rule=Host(`arcane.${DOMAIN:?DOMAIN must be set}`)
      - traefik.http.services.arcane.loadbalancer.server.port=3552
      - traefik.docker.network=core

networks:
  core:
    external: true
