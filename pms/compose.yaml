name: pms

services:
  # qBittorrent bittorrent client
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    restart: unless-stopped
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - TORRENTING_PORT=54321
    ports:
      - 54321:54321
    networks:
      - default
      - core
    volumes:
      - ./qbittorrent:/config
      - ${HOST_MEDIA}:/media
    labels:
      - traefik.enable=true
      - traefik.http.routers.qbittorrent.rule=Host(`qbittorrent.${DOMAIN}`)
      - traefik.http.services.qbittorrent.loadbalancer.server.port=8080
      - homepage.group=Downloaders
      - homepage.name=qBittorrent
      - homepage.description=BitTorrent client
      - homepage.icon=qbittorrent
      - homepage.href=https://qbittorrent.${DOMAIN}
      - homepage.widget.type=qbittorrent
      - homepage.widget.url=http://qbittorrent:8080
      - homepage.widget.username=${QBITTORRENT_USERNAME}
      - homepage.widget.password=${QBITTORRENT_PASSWORD}

  # SABnzbd usenet downloader
  sabnzbd:
    image: lscr.io/linuxserver/sabnzbd:latest
    container_name: sabnzbd
    restart: unless-stopped
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    networks:
      - default
      - core
    volumes:
      - ./sabnzbd:/config
      - ${HOST_MEDIA}:/media
    labels:
      - traefik.enable=true
      - traefik.http.routers.sabnzbd.rule=Host(`sabnzbd.${DOMAIN}`)
      - traefik.http.services.sabnzbd.loadbalancer.server.port=8080
      - homepage.group=Downloaders
      - homepage.name=SABnzbd
      - homepage.description=Usenet download manager
      - homepage.icon=sabnzbd
      - homepage.href=https://sabnzbd.${DOMAIN}
      - homepage.widget.type=sabnzbd
      - homepage.widget.url=http://sabnzbd:8080
      - homepage.widget.key=${SABNZBD_API_KEY}

  # PostgreSQL database service
  postgres:
    image: postgres:17
    container_name: pms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      start_period: 20s
      interval: 30s
      retries: 5
      timeout: 5s

  # Sonarr TV show manager
  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    restart: unless-stopped
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - SONARR__AUTH__APIKEY=${SONARR_API_KEY}
      - SONARR__AUTH__METHOD=Forms
      - SONARR__POSTGRES__HOST=pms-postgres
      - SONARR__POSTGRES__USER=sonarr
      - SONARR__POSTGRES__PASSWORD=${SONARR_POSTGRES_PASSWORD}
      - SONARR__POSTGRES__MAINDB=sonarr_main
      - SONARR__POSTGRES__LOGDB=sonarr_log
      - SONARR__UPDATE__MECHANISM=Docker
    networks:
      - default
      - core
    volumes:
      - ./sonarr:/config
      - ${HOST_MEDIA}:/media
    depends_on:
      postgres:
        condition: service_healthy
      qbittorrent:
        condition: service_started
      sabnzbd:
        condition: service_started
    labels:
      - traefik.enable=true
      - traefik.http.routers.sonarr.rule=Host(`sonarr.${DOMAIN}`)
      - traefik.http.services.sonarr.loadbalancer.server.port=8989
      - homepage.group=Media
      - homepage.name=Sonarr
      - homepage.description=TV series manager
      - homepage.icon=sonarr
      - homepage.href=https://sonarr.${DOMAIN}
      - homepage.widget.type=sonarr
      - homepage.widget.url=http://sonarr:8989
      - homepage.widget.key=${SONARR_API_KEY}

  # Radarr movie manager
  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    restart: unless-stopped
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - RADARR__AUTH__APIKEY=${RADARR_API_KEY}
      - RADARR__AUTH__METHOD=Forms
      - RADARR__POSTGRES__HOST=pms-postgres
      - RADARR__POSTGRES__USER=radarr
      - RADARR__POSTGRES__PASSWORD=${RADARR_POSTGRES_PASSWORD}
      - RADARR__POSTGRES__MAINDB=radarr_main
      - RADARR__POSTGRES__LOGDB=radarr_log
      - RADARR__UPDATE__MECHANISM=Docker
    networks:
      - default
      - core
    volumes:
      - ./radarr:/config
      - ${HOST_MEDIA}:/media
    depends_on:
      postgres:
        condition: service_healthy
      qbittorrent:
        condition: service_started
      sabnzbd:
        condition: service_started
    labels:
      - traefik.enable=true
      - traefik.http.routers.radarr.rule=Host(`radarr.${DOMAIN}`)
      - homepage.group=Media
      - homepage.name=Radarr
      - homepage.description=Movie manager
      - homepage.icon=radarr
      - homepage.href=https://radarr.${DOMAIN}
      - homepage.widget.type=radarr
      - homepage.widget.url=http://radarr:7878
      - homepage.widget.key=${RADARR_API_KEY}

  # Lidarr music manager
  lidarr:
    image: lscr.io/linuxserver/lidarr:latest
    container_name: lidarr
    restart: unless-stopped
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - LIDARR__AUTH__APIKEY=${LIDARR_API_KEY}
      - LIDARR__AUTH__METHOD=Forms
      - LIDARR__POSTGRES__HOST=pms-postgres
      - LIDARR__POSTGRES__USER=lidarr
      - LIDARR__POSTGRES__PASSWORD=${LIDARR_POSTGRES_PASSWORD}
      - LIDARR__POSTGRES__MAINDB=lidarr_main
      - LIDARR__POSTGRES__LOGDB=lidarr_log
      - LIDARR__UPDATE__MECHANISM=Docker
    networks:
      - default
      - core
    volumes:
      - ./lidarr:/config
      - ${HOST_MEDIA}:/media
    depends_on:
      postgres:
        condition: service_healthy
      qbittorrent:
        condition: service_started
      sabnzbd:
        condition: service_started
    labels:
      - traefik.enable=true
      - traefik.http.routers.lidarr.rule=Host(`lidarr.${DOMAIN}`)
      - homepage.group=Media
      - homepage.name=Lidarr
      - homepage.description=Music manager
      - homepage.icon=lidarr
      - homepage.href=https://lidarr.${DOMAIN}
      - homepage.widget.type=lidarr
      - homepage.widget.url=http://lidarr:8686
      - homepage.widget.key=${LIDARR_API_KEY}

  # Prowlarr indexer manager
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    restart: unless-stopped
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - PROWLARR__AUTH__APIKEY=${PROWLARR_API_KEY}
      - PROWLARR__AUTH__METHOD=Forms
      - PROWLARR__POSTGRES__HOST=pms-postgres
      - PROWLARR__POSTGRES__USER=prowlarr
      - PROWLARR__POSTGRES__PASSWORD=${PROWLARR_POSTGRES_PASSWORD}
      - PROWLARR__POSTGRES__MAINDB=prowlarr_main
      - PROWLARR__POSTGRES__LOGDB=prowlarr_log
      - PROWLARR__UPDATE__MECHANISM=Docker
    networks:
      - default
      - core
    volumes:
      - ./prowlarr:/config
    depends_on:
      postgres:
        condition: service_healthy
      qbittorrent:
        condition: service_started
      sabnzbd:
        condition: service_started
    labels:
      - traefik.enable=true
      - traefik.http.routers.prowlarr.rule=Host(`prowlarr.${DOMAIN}`)
      - homepage.group=Downloaders
      - homepage.name=Prowlarr
      - homepage.description=Indexer manager
      - homepage.icon=prowlarr
      - homepage.href=https://prowlarr.${DOMAIN}
      - homepage.widget.type=prowlarr
      - homepage.widget.url=http://prowlarr:9696
      - homepage.widget.key=${PROWLARR_API_KEY}

  # Tautulli media server monitoring
  tautulli:
    image: lscr.io/linuxserver/tautulli:latest
    container_name: tautulli
    restart: unless-stopped
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    networks:
      - default
      - core
    volumes:
      - ./tautulli:/config
    labels:
      - traefik.enable=true
      - traefik.http.routers.tautulli.rule=Host(`tautulli.${DOMAIN}`)
      - homepage.group=Media
      - homepage.name=Tautulli
      - homepage.description=Media server monitoring
      - homepage.icon=tautulli
      - homepage.href=https://tautulli.${DOMAIN}
      - homepage.widget.type=tautulli
      - homepage.widget.url=http://tautulli:8181
      - homepage.widget.key=${TAUTULLI_API_KEY}

  # Seerr media request manager
  seerr:
    image: ghcr.io/seerr-team/seerr:latest
    container_name: seerr
    restart: unless-stopped
    user: ${PUID}:${PGID}
    environment:
      - LOG_LEVEL=info
      - TZ=${TZ}
    networks:
      - default
      - core
    volumes:
      - ./seerr:/app/config
    labels:
      - traefik.enable=true
      - traefik.http.routers.seerr.rule=Host(`seerr.${DOMAIN}`)
      - traefik.http.services.seerr.loadbalancer.server.port=5055
      - homepage.group=Media
      - homepage.name=Seerr
      - homepage.description=Media request manager
      - homepage.icon=seerr
      - homepage.href=https://seerr.${DOMAIN}
      - homepage.widget.type=seerr
      - homepage.widget.url=http://seerr:5055
      - homepage.widget.key=${SEERR_API_KEY}
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:5055/api/v1/settings/public || exit 1
      start_period: 20s
      timeout: 3s
      interval: 15s
      retries: 3
    security_opt:
      - no-new-privileges
    cap_drop:
      - ALL

networks:
  default:
    name: pms
  core:
    name: core
    external: true
