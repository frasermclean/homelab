name: immich

services:
  # Postgres database with vector support
  database:
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0
    container_name: immich-database
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_INITDB_ARGS: '--data-checksums'
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    shm_size: 128mb # Docker's 64MB default is too small for large vector search queries

  # Redis compatible cache
  cache:
    image: valkey/valkey:8
    container_name: immich-cache
    restart: unless-stopped
    healthcheck:
      test: redis-cli ping || exit 1
    volumes:
      - cache-data:/data

  # Immich server
  server:
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION:-release}
    container_name: immich-server
    restart: unless-stopped
    user: ${PUID:?PUID must be set}:${PGID:?PGID must be set}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - NET_RAW
    environment:
      - TZ=${TZ}
      - DB_HOSTNAME=immich-database
      - DB_USERNAME=${POSTGRES_USER}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - DB_DATABASE_NAME=${POSTGRES_DB}
      - REDIS_HOSTNAME=immich-cache
    volumes:
      - ./data:/data
      - ${HOST_BACKUP:?HOST_BACKUP must be set}/immich:/data/backups
      - ${HOST_MEDIA:?HOST_MEDIA must be set}/photos:/data/library
      - /etc/localtime:/etc/localtime:ro
    networks:
      - default
      - core
    depends_on:
      - database
      - cache
    labels:
      - traefik.enable=true
      - traefik.http.routers.immich.rule=Host(`immich.${DOMAIN}`)
      - homepage.group=Media
      - homepage.name=Immich
      - homepage.description=Photo and video library
      - homepage.icon=immich
      - homepage.href=https://immich.${DOMAIN}
      - homepage.widget.type=immich
      - homepage.widget.version=2
      - homepage.widget.url=http://immich-server:2283
      - homepage.widget.key=${WIDGET_API_KEY}

  # Immich machine learning service
  machine-learning:
    image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION:-release}
    container_name: immich-machine-learning
    restart: unless-stopped
    user: ${PUID:?PUID must be set}:${PGID:?PGID must be set}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - NET_RAW
    volumes:
      - ./model-cache:/cache # bind mount - named volumes are created root-owned

networks:
  default:
    name: immich
    driver: bridge
  core:
    external: true

volumes:
  cache-data:
    name: immich-cache-data
