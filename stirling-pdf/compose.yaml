name: stirling-pdf

services:
  stirling-pdf:
    image: docker.stirlingpdf.com/stirlingtools/stirling-pdf:latest
    container_name: stirling-pdf
    restart: unless-stopped
    ports:
      - '8080:8080'
    environment:
      SYSTEM_DEFAULTLOCALE: en-GB
      SYSTEM_FRONTENDURL: https://pdf.${DOMAIN}
      SECURITY_ENABLELOGIN: true
      SECURITY_INITIALLOGIN_USERNAME: ${INITIAL_USERNAME}
      SECURITY_INITIALLOGIN_PASSWORD: ${INITIAL_PASSWORD}
      SECURITY_OAUTH2_PROVIDER: pocketid
      SECURITY_OAUTH2_ISSUER: https://id.${DOMAIN}
      SECURITY_OAUTH2_CLIENTID: ${OAUTH2_CLIENTID}
      SECURITY_OAUTH2_CLIENTSECRET: ${OAUTH2_CLIENTSECRET}
      SECURITY_OAUTH2_SCOPES: 'openid, profile, email'
      SECURITY_OAUTH2_USEASUSERNAME: preferred_username
    volumes:
      - configs:/configs
      - logs:/logs
      - customFiles:/customFiles
      - pipeline:/pipeline
      - storage:/storage
      - tessdata:/usr/share/tessdata
    mem_limit: 4g

networks:
  default:
    driver: bridge
    name: stirling-pdf

volumes:
  configs:
    name: stirling-pdf-configs
  logs:
    name: stirling-pdf-logs
  customFiles:
    name: stirling-pdf-customFiles
  pipeline:
    name: stirling-pdf-pipeline
  storage:
    name: stirling-pdf-storage
  tessdata:
    name: stirling-pdf-tessdata
