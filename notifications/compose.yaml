name: notifications

services:
  # Apprise API
  apprise:
    image: caronc/apprise:latest
    container_name: apprise
    restart: unless-stopped
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - APPRISE_STATEFUL_MODE=simple
      - APPRISE_WORKER_COUNT=1
    volumes:
      - ./apprise/config:/config
      - ./apprise/plugin:/plugin
      - ./apprise/attach:/attach
    labels:
      - traefik.enable=true
      - traefik.http.routers.apprise.rule=Host(`apprise.${DOMAIN}`)
      - traefik.http.services.apprise.loadbalancer.server.port=8000
    networks:
      - core

  # Ntfy notification service
  ntfy:
    image: binwiederhier/ntfy:latest
    container_name: ntfy
    restart: unless-stopped
    command: ['serve']
    environment:
      - TZ=${TZ}
      - NTFY_BASE_URL=https://ntfy.${DOMAIN}
      - NTFY_BEHIND_PROXY=true
      - NTFY_CACHE_FILE=/var/lib/ntfy/cache.db
      - NTFY_AUTH_FILE=/var/lib/ntfy/auth.db
      - NTFY_ATTACHMENT_CACHE_DIR=/var/lib/ntfy/attachments
      - NTFY_AUTH_DEFAULT_ACCESS=deny-all
      - NTFY_AUTH_USERS=${NTFY_AUTH_USERS}
      - NTFY_AUTH_ACCESS=service:*:rw
      - NTFY_ENABLE_LOGIN=true
      - NTFY_REQUIRE_LOGIN=true # all actions via the web app require a login
    user: ${PUID}:${PGID}
    networks:
      - core
    volumes:
      - ./ntfy:/var/lib/ntfy
    labels:
      traefik.enable: true
      traefik.http.routers.ntfy.rule: Host(`ntfy.${DOMAIN}`)
      traefik.http.services.ntfy.loadbalancer.server.port: 80
    healthcheck: # optional: remember to adapt the host:port to your environment
      test:
        - 'CMD-SHELL'
        - "wget -q --tries=1 http://localhost:80/v1/health -O - | grep -Eo '\"healthy\"\\s*:\\s*true' || exit 1"
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 40s
    init: true # needed, if healthcheck is used. Prevents zombie processes

networks:
  core:
    external: true
